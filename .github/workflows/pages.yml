name: Publicar NUVIA Portal Alfa en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # El BCE publica el €STR cada día hábil a las 08:00 CET.
    # A las 08:30 UTC ya está disponible tanto en horario de invierno
    # como de verano; en fines de semana conserva la última observación.
    - cron: '30 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependencias del portal
        run: npm ci

      - name: Preparar Chromium para la auditoría visual
        run: |
          # El Chromium de Playwright se descarga desde su propio CDN. El índice
          # de Chrome preinstalado en el runner puede fallar por Hash Sum mismatch.
          # Usar una copia temporal de las fuentes APT sin ese repositorio evita
          # depender de él, conservando las verificaciones de integridad de APT.
          apt_sources="$RUNNER_TEMP/nuvia-apt-sources"
          mkdir -p "$apt_sources"
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if ! grep -Eq 'https?://dl\.google\.com/linux/chrome(-stable)?/deb' "$source"; then
              cp "$source" "$apt_sources/"
            fi
          done
          printf 'Dir::Etc::sourceparts "%s";\n' "$apt_sources" > "$RUNNER_TEMP/nuvia-apt.conf"
          sudo env APT_CONFIG="$RUNNER_TEMP/nuvia-apt.conf" "$(command -v node)" node_modules/playwright/cli.js install-deps chromium
          npx playwright install chromium

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Actualizar la tasa sin riesgo oficial del BCE
        run: node scripts/update-ecb-risk-free.mjs
        # Si el portal del BCE tiene una incidencia puntual, se publica la
        # última copia verificada incluida en el repositorio y la fecha visible
        # deja claro hasta qué observación llega.
        continue-on-error: true

      - name: Actualizar indicadores macroeconómicos oficiales
        run: node scripts/update-macro-data.mjs
        # Solo sustituye la copia cuando se han podido verificar las cinco series.
        # Un fallo conserva las cifras anteriores y su fecha real de comprobación.
        continue-on-error: true

      - name: Actualizar noticias económicas
        run: node scripts/update-daily-news.mjs
        # Si los medios no responden, se conserva la selección del repositorio
        # con su fecha real. Los contextos temáticos no son resúmenes verificados.
        continue-on-error: true

      - name: Construir y validar la web
        run: npm run build
        env:
          NUVIA_RENDER_OFFLINE: '1'

      - name: Verificar las páginas críticas en tablet
        run: npm run auditar:tablet
        env:
          NUVIA_RENDER_OFFLINE: '1'

      - name: Preparar los archivos publicados
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <base href="/">
  <title>Comparación de banners · NUVIA · Solo local</title>
  <link rel="stylesheet" href="/estilos/nuvia-tokens.css">
  <link rel="stylesheet" href="/estilos/nuvia-components.css">
  <link rel="stylesheet" href="/estilos/nuvia-pages.css?v=banners-editorial-light-20260831">
  <link rel="stylesheet" href="/docs/previews/banners.css">
</head>
<body>
  <header class="preview-bar">
    <div class="nv-container preview-bar__inner">
      <div><h1 id="preview-title">Comparación de banners</h1><p>Economía, Patrimonio y Bienestar · Títulos fuera · Vista local sin publicar</p></div>
      <nav class="preview-options" aria-label="Elegir versión">
        <a href="/docs/previews/banners.html?version=editorial" data-version="editorial">A · Editorial</a>
        <a href="/docs/previews/banners.html?version=listado" data-version="listado">B · Listado</a>
      </nav>
    </div>
  </header>
  <main id="preview-content" class="preview-main" aria-busy="true"></main>
  <script type="module">
    const version = new URLSearchParams(location.search).get('version') === 'listado' ? 'listado' : 'editorial';
    const label = version === 'editorial' ? 'A · Composición editorial' : 'B · Descripción y listado de temas';
    document.title = `${label} · NUVIA · Solo local`;
    document.getElementById('preview-title').textContent = label;
    document.querySelector(`[data-version="${version}"]`).setAttribute('aria-current', 'page');
    const main = document.getElementById('preview-content');
    try {
      const response = await fetch('index.html', {cache: 'no-store'});
      if (!response.ok) throw new Error('No se pudo leer la home local');
      const source = new DOMParser().parseFromString(await response.text(), 'text/html');
      for (const id of ['mercados', 'patrimonio', 'familia-salud']) {
        const section = source.getElementById(id)?.cloneNode(true);
        if (!section) throw new Error(`Falta la sección ${id}`);
        const banner = section.querySelector('.home-section-banner');
        banner.className = `home-section-banner home-section-banner--${version === 'editorial' || id === 'mercados' ? 'editorial' : 'index'}`;
        if (version === 'listado' && id === 'familia-salud') {
          banner.querySelector('.home-section-banner__tags')?.remove();
          const index = document.createElement('ol');
          index.className = 'home-section-banner__index';
          index.setAttribute('aria-label', 'Pilares de una vida equilibrada');
          const topics = [
            ['Familia y relaciones', 'Vínculos, convivencia y tiempo compartido'],
            ['Salud mental', 'Bienestar emocional y ritmo de vida'],
            ['Salud física', 'Movimiento, descanso y hábitos cotidianos'],
            ['Equilibrio diario', 'Organización del tiempo y conciliación'],
          ];
          for (const [i, [title, detail]] of topics.entries()) {
            const row = document.createElement('li');
            row.className = 'home-section-banner__row';
            row.innerHTML = `<span class="home-section-banner__number" aria-hidden="true">0${i + 1}</span><div><h4>${title}</h4><p>${detail}</p></div>`;
            index.append(row);
          }
          banner.append(index);
        }
        if (version === 'listado' && id === 'patrimonio') {
          banner.querySelector('.home-section-banner__actions').remove();
          const nav = document.createElement('nav');
          nav.className = 'home-section-banner__index';
          nav.setAttribute('aria-label', 'Temas de Patrimonio');
          const topics = [
            ['vivienda.html', 'Vivienda y coste de vida', 'Compra o alquiler, financiación, presupuesto'],
            ['fiscalidad.html', 'Mis impuestos', 'Obligaciones, planificación, documentación'],
            ['jubilacion.html', 'Jubilación', 'Ingresos futuros, longevidad, legado'],
          ];
          for (const [i, [href, title, detail]] of topics.entries()) {
            const link = document.createElement('a');
            link.className = 'home-section-banner__row preview-index-link';
            link.href = href;
            link.innerHTML = `<span class="home-section-banner__number" aria-hidden="true">0${i + 1}</span><div><h4>${title}</h4><p>${detail}</p></div><span aria-hidden="true">→</span>`;
            nav.append(link);
          }
          banner.append(nav);
        }
        for (const img of section.querySelectorAll('img')) img.loading = 'eager';
        main.append(section);
      }
    } catch (error) {
      main.textContent = `No se ha podido abrir la comparación: ${error.message}`;
      main.classList.add('preview-error');
    } finally {
      main.setAttribute('aria-busy', 'false');
    }
  </script>
</body>
</html>

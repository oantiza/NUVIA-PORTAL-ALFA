<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Ilustración del laboratorio de cartera: composición, riesgo y rentabilidad, y escenarios" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2347"/><stop offset="1" stop-color="#1b3d66"/></linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".6"><stop offset="0" stop-color="#b69152" stop-opacity=".28"/><stop offset="1" stop-color="#b69152" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".1" cy=".95" r=".5"><stop offset="0" stop-color="#7c9a44" stop-opacity=".16"/><stop offset="1" stop-color="#7c9a44" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/></pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#284c75" stop-opacity=".28"/><stop offset="1" stop-color="#284c75" stop-opacity="0"/></linearGradient>
    <linearGradient id="fanOuter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b69152" stop-opacity=".04"/><stop offset="1" stop-color="#b69152" stop-opacity=".22"/></linearGradient>
    <linearGradient id="fanInner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b69152" stop-opacity=".08"/><stop offset="1" stop-color="#b69152" stop-opacity=".42"/></linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fb3cc"/><stop offset="1" stop-color="#b69152"/></linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#030d1c" flood-opacity=".42"/></filter>
    <filter id="shs" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030d1c" flood-opacity=".38"/></filter>
    <style>
      .t{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}
      .k{font-size:15px;font-weight:700;letter-spacing:2.4px;fill:#5b6472}
      .kd{font-size:15px;font-weight:700;letter-spacing:2.4px;fill:#dcc59c}
      .s{font-size:13px;font-weight:600;fill:#5b6472}
      .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:d 1.8s .3s cubic-bezier(.4,0,.2,1) forwards}
      .draw2{stroke-dasharray:1200;stroke-dashoffset:1200;animation:d 1.6s .9s cubic-bezier(.4,0,.2,1) forwards}
      .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:p .6s 1.6s ease-out forwards}
      .fade{opacity:0;animation:f 1s .6s ease-out forwards}
      @keyframes d{to{stroke-dashoffset:0}}
      @keyframes p{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      @keyframes f{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.draw,.draw2{animation:none;stroke-dashoffset:0}.pop,.fade{animation:none;opacity:1}}
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1000" height="600" fill="url(#bg)"/>
  <rect width="1000" height="600" fill="url(#dots)"/>
  <rect width="1000" height="600" fill="url(#glow)"/>
  <rect width="1000" height="600" fill="url(#glow2)"/>

  <!-- Panel principal -->
  <g filter="url(#sh)"><rect x="64" y="78" width="600" height="452" rx="20" fill="#ffffff"/></g>
  <rect x="64" y="78" width="600" height="56" rx="20" fill="#f4f6f9"/>
  <rect x="64" y="114" width="600" height="20" fill="#f4f6f9"/>
  <path d="M64 134H664" stroke="#e1e7ef" stroke-width="1.5"/>
  <g fill="#d5dde8"><circle cx="92" cy="106" r="6"/><circle cx="112" cy="106" r="6"/><circle cx="132" cy="106" r="6"/></g>
  <g class="t">
    <rect x="172" y="92" width="92" height="28" rx="14" fill="#0b2347"/>
    <text x="218" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Cartera</text>
    <text x="300" y="111" text-anchor="middle" class="s">Riesgo</text>
    <text x="388" y="111" text-anchor="middle" class="s">Escenarios</text>
  </g>

  <!-- Indicadores -->
  <g class="t">
    <rect x="88" y="152" width="178" height="68" rx="12" fill="#f4f6f9"/>
    <text x="104" y="176" class="s">Posiciones</text>
    <rect x="104" y="190" width="54" height="16" rx="5" fill="#0b2347"/>
    <rect x="276" y="152" width="178" height="68" rx="12" fill="#f4f6f9"/>
    <text x="292" y="176" class="s">Volatilidad</text>
    <rect x="292" y="190" width="78" height="16" rx="5" fill="#0b2347"/>
    <rect x="464" y="152" width="178" height="68" rx="12" fill="#f4f6f9"/>
    <text x="480" y="176" class="s">Diversificación</text>
    <rect x="480" y="190" width="120" height="8" rx="4" fill="#e1e7ef"/>
    <rect x="480" y="190" width="86" height="8" rx="4" fill="#1f625c"/>
    <rect x="480" y="204" width="44" height="6" rx="3" fill="#cfd7e2"/>
  </g>

  <!-- Composición: anillo -->
  <g transform="translate(174 322)" fill="none" stroke-width="24">
    <circle r="66" stroke="#eef2f7"/>
    <g transform="rotate(-90)">
      <circle r="66" stroke="#0b2347" stroke-dasharray="148 267" />
      <circle r="66" stroke="#1f625c" stroke-dasharray="96 319" stroke-dashoffset="-152"/>
      <circle r="66" stroke="#b69152" stroke-dasharray="78 337" stroke-dashoffset="-252"/>
      <circle r="66" stroke="#5b4487" stroke-dasharray="52 363" stroke-dashoffset="-334"/>
      <circle r="66" stroke="#3d5670" stroke-dasharray="25 390" stroke-dashoffset="-390"/>
    </g>
  </g>
  <circle cx="174" cy="322" r="40" fill="#ffffff"/>
  <rect x="150" y="310" width="48" height="12" rx="4" fill="#0b2347"/>
  <rect x="158" y="328" width="32" height="7" rx="3.5" fill="#cfd7e2"/>

  <!-- Composición: barras -->
  <g>
    <g transform="translate(282 262)">
      <circle cx="6" cy="6" r="6" fill="#0b2347"/><rect x="20" y="1" width="74" height="10" rx="5" fill="#e1e7ef"/>
      <rect x="120" y="2" width="236" height="8" rx="4" fill="#eef2f7"/><rect x="120" y="2" width="84" height="8" rx="4" fill="#0b2347"/>
    </g>
    <g transform="translate(282 292)">
      <circle cx="6" cy="6" r="6" fill="#1f625c"/><rect x="20" y="1" width="60" height="10" rx="5" fill="#e1e7ef"/>
      <rect x="120" y="2" width="236" height="8" rx="4" fill="#eef2f7"/><rect x="120" y="2" width="55" height="8" rx="4" fill="#1f625c"/>
    </g>
    <g transform="translate(282 322)">
      <circle cx="6" cy="6" r="6" fill="#b69152"/><rect x="20" y="1" width="66" height="10" rx="5" fill="#e1e7ef"/>
      <rect x="120" y="2" width="236" height="8" rx="4" fill="#eef2f7"/><rect x="120" y="2" width="44" height="8" rx="4" fill="#b69152"/>
    </g>
    <g transform="translate(282 352)">
      <circle cx="6" cy="6" r="6" fill="#5b4487"/><rect x="20" y="1" width="52" height="10" rx="5" fill="#e1e7ef"/>
      <rect x="120" y="2" width="236" height="8" rx="4" fill="#eef2f7"/><rect x="120" y="2" width="30" height="8" rx="4" fill="#5b4487"/>
    </g>
    <g transform="translate(282 382)">
      <circle cx="6" cy="6" r="6" fill="#3d5670"/><rect x="20" y="1" width="44" height="10" rx="5" fill="#e1e7ef"/>
      <rect x="120" y="2" width="236" height="8" rx="4" fill="#eef2f7"/><rect x="120" y="2" width="15" height="8" rx="4" fill="#3d5670"/>
    </g>
  </g>

  <!-- Evolución: área -->
  <g transform="translate(88 424)">
    <path d="M0 80H552" stroke="#e1e7ef" stroke-width="1.5"/>
    <path d="M0 40H552" stroke="#eef2f7" stroke-width="1.5" stroke-dasharray="4 6"/>
    <path class="fade" d="M0 66 C 40 62, 70 70, 110 58 S 180 40, 220 48 S 300 30, 340 34 S 420 16, 470 20 S 530 8, 552 6 V80 H0 Z" fill="url(#area)"/>
    <path class="draw" d="M0 66 C 40 62, 70 70, 110 58 S 180 40, 220 48 S 300 30, 340 34 S 420 16, 470 20 S 530 8, 552 6" fill="none" stroke="#284c75" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Tarjeta flotante: riesgo y rentabilidad -->
  <g filter="url(#sh)"><rect x="604" y="34" width="354" height="236" rx="20" fill="#ffffff"/></g>
  <text x="630" y="72" class="t k">RIESGO · RENTABILIDAD</text>
  <g transform="translate(640 96)">
    <path d="M0 146H292M0 146V0" stroke="#cfd7e2" stroke-width="2"/>
    <g stroke="#eef2f7" stroke-width="1.5"><path d="M0 98H292M0 50H292"/></g>
    <path class="draw2" d="M14 138 C 40 84, 96 44, 180 30 S 262 14, 290 10" fill="none" stroke="#284c75" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="#9fb3cc"><circle cx="70" cy="120" r="6.5"/><circle cx="118" cy="104" r="6.5"/><circle cx="156" cy="124" r="6.5"/><circle cx="196" cy="84" r="6.5"/><circle cx="236" cy="100" r="6.5"/><circle cx="262" cy="64" r="6.5"/><circle cx="96" cy="136" r="6.5"/></g>
    <g stroke="#b69152" stroke-width="1.5" stroke-dasharray="4 5" class="fade"><path d="M150 36V146M150 36H0"/></g>
    <g class="pop"><circle cx="150" cy="36" r="20" fill="#b69152" fill-opacity=".18"/><circle cx="150" cy="36" r="10" fill="#b69152" stroke="#ffffff" stroke-width="3.5"/></g>
  </g>

  <!-- Tarjeta flotante: escenarios -->
  <g filter="url(#sh)"><rect x="566" y="316" width="392" height="246" rx="20" fill="#ffffff"/></g>
  <text x="592" y="354" class="t k">ESCENARIOS</text>
  <g transform="translate(596 374)">
    <path d="M0 150H336" stroke="#cfd7e2" stroke-width="2"/>
    <path d="M0 96 L336 8 L336 158 Z" fill="url(#fanOuter)"/>
    <path d="M0 96 L336 38 L336 124 Z" fill="url(#fanInner)"/>
    <path d="M0 96 L336 80" stroke="#b69152" stroke-width="2" stroke-dasharray="5 6"/>
    <path class="draw" d="M0 96 C 30 94, 50 104, 84 92 S 140 86, 170 80 S 240 70, 270 66 S 318 60, 336 56" fill="none" stroke="#0b2347" stroke-width="3.5" stroke-linecap="round"/>
    <g class="t" font-size="12" font-weight="600" fill="#7a5c27"><text x="342" y="14">+</text><text x="342" y="84">·</text><text x="342" y="160">−</text></g>
  </g>

  <!-- Chip flotante: volatilidad -->
  <g filter="url(#shs)"><rect x="30" y="470" width="238" height="104" rx="18" fill="#15365f" stroke="#b69152" stroke-opacity=".55"/></g>
  <text x="54" y="504" class="t kd">RIESGO</text>
  <g transform="translate(206 548)" fill="none" stroke-linecap="round">
    <path d="M-38 0 A38 38 0 0 1 38 0" stroke="#ffffff" stroke-opacity=".14" stroke-width="10"/>
    <path class="draw2" d="M-38 0 A38 38 0 0 1 20 -32" stroke="url(#gauge)" stroke-width="10"/>
  </g>
  <rect x="54" y="522" width="86" height="14" rx="5" fill="#ffffff" fill-opacity=".92"/>
  <rect x="54" y="546" width="56" height="8" rx="4" fill="#ffffff" fill-opacity=".22"/>
</svg>
